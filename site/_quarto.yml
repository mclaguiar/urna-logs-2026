project:
  type: website
  output-dir: _site
  resources:
    - data/secao
    - data/migracao

website:
  title: "urna-logs-2026"
  description: "Auditoria 1º×2º turno — migração agregada, abstenção e sem digital"
  site-url: https://mclaguiar.github.io/urna-logs-2026/
  navbar:
    left:
      - href: index.qmd
        text: Visão geral
      - href: assinaturas.qmd
        text: Integridade dos arquivos
      - href: auditoria.qmd
        text: Auditoria
      - href: secao.qmd
        text: Consulta por seção
      - href: migracao.qmd
        text: Migração (estimativa)
      - href: metodo.qmd
        text: Método e glossário
    right:
      - icon: github
        href: https://github.com/mclaguiar/urna-logs-2026
        aria-label: GitHub

format:
  html:
    theme: cosmo
    css: estilo.css
    include-in-header:
      - file: marca.html
    toc: true
    lang: pt-BR
    link-external-newwindow: true
    # plain evita MathJax ($) engolir expressões OJS
    html-math-method: plain
    # padrão do Quarto: body 800px. Painel tem tabelas e plots de ~1000px.
    grid:
      sidebar-width: 0px
      body-width: 1200px
      margin-width: 250px

execute:
  echo: false
