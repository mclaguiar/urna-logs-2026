[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urna-logs"
version = "0.1.0"
description = "Validação de logs das urnas eletrônicas — Eleições 2026"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pandas>=2.2",
  "pyarrow>=16",
  "typer>=0.12",
  "rich>=13",
  "asn1tools>=0.167",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
urna-logs = "urna_logs.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
urna_logs = ["spec/*.asn1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
